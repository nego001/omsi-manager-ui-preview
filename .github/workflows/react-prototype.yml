name: React Prototype Validation
on:
  push:
    branches: [feat/react-nine-screens-safe, main]
  pull_request:
concurrency:
  group: react-prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:security
      - name: Portable build identity contract
        run: node --test scripts/portable-build-manifest.test.mjs
      - name: Optional XDG desktop shortcut tests (disposable HOME)
        run: node --test scripts/linux-desktop-integration.test.cjs
      - name: Wayland session and portal diagnostics (isolated Unix sockets)
        run: node --test scripts/linux-session-diagnostics.test.cjs
      - name: AppArmor host-capability classification contracts (synthetic only)
        run: node --test scripts/auto-x11-host-policy-contract.test.mjs
      - name: Strict X11 host category repeatability contracts (synthetic only)
        run: node --test scripts/auto-x11-host-stability.test.mjs
      - name: Native ELF sandbox preflight parser contracts (synthetic only)
        run: node --test scripts/native-sandbox-preflight-contract.test.mjs
      - name: Strict native X11 matrix admission guard
        run: node --test scripts/native-x11-workflow-admission.test.mjs
      - name: Mandatory unfiltered PR event coverage contracts (M25)
        run: python3 -m unittest discover -s scripts -p test_controlled_ci_event_coverage.py -v
      - name: GNOME KDE Hyprland manual picker contracts (no GUI)
        run: npm run test:manual:contract
      - name: Safe desktop geometry contract
        run: node --test scripts/desktop-layout-contract.test.mjs
      - name: Controlled real ZIP byte fixture contracts (in-memory CI only)
        run: python3 -m unittest discover -s scripts -p 'test_controlled_*.py' -v
      - name: Emit CI-only disposable ZIP FD evidence for per-package UI contract
        run: |
          set -euo pipefail
          # scripts/ is excluded from distributed Electron packages and
          # is not Playwright's auto-cleaned test-results/ directory.
          python3 -I -S -B scripts/emit_controlled_ci_fd_evidence.py > scripts/ci-disposable-fd-evidence.json
          test -s scripts/ci-disposable-fd-evidence.json
      - name: Native auto-launcher manual desktop contracts (no GUI)
        run: node --test scripts/manual-auto-launch-contract.test.mjs
      - name: Isolated temporary recovery / process restart fixture
        run: npm run test:recovery:fixture
      - name: Synthetic witness crash and incomplete-history tests
        run: npm run test:witness
      - name: Separate Linux principals and peer credentials (disposable hosted runner only)
        if: runner.environment == 'github-hosted'
        env:
          OMSI_SYNTHETIC_HOSTED_RUNNER: ${{ runner.environment }}
        run: |
          sudo -n env \
            OMSI_SYNTHETIC_HOSTED_RUNNER="$OMSI_SYNTHETIC_HOSTED_RUNNER" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            python3 native-lab/synthetic-linux-principal-lab.py orchestrate
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Electron desktop smoke test
        run: xvfb-run -a npm run test:desktop
      - name: Native folder inspection IPC E2E
        run: xvfb-run -a npm run test:inspection:e2e
      - name: Build Linux x64 unsigned portable preview
        run: npm run package:linux
      - name: Automatic Linux ELF launcher regression (synthetic process)
        run: node --test scripts/linux-auto-launcher.test.cjs
      - name: Packaged renderer kernel evidence parser contracts (synthetic only)
        run: node --test scripts/electron-renderer-kernel-evidence.test.mjs
      - name: Test packaged Linux ELF GUI using synthetic game folder
        timeout-minutes: 5
        run: xvfb-run -a npm run test:portable:linux
      - name: Native auto X11 GUI contract (synthetic read-only)
        run: node --test scripts/auto-real-x11-contract.test.mjs
      - name: Native X11 triage categories, privacy and strict-sandbox contracts
        run: node --test scripts/auto-x11-native-triage.test.mjs
      - name: Early native process kernel category privacy and status contracts
        run: node --test scripts/auto-x11-early-native-kernel.test.mjs
      - name: Native startup-edge cmdline witness refusal tests
        run: node --test scripts/auto-x11-spawn-witness.test.mjs
      - name: Archive SHA256 fingerprint and strict sidecar contracts (synthetic only)
        run: node --test scripts/auto-x11-archive-provenance.test.mjs
      - name: Sanitized X11 evidence format and privacy refusal contracts
        run: node --test scripts/auto-x11-sanitized-evidence.test.mjs
      - name: Cross-runner X11 evidence comparison refusal contracts
        run: node --test scripts/auto-x11-evidence-diff.test.mjs
      - name: Read-only operator handoff refusal contracts
        run: node --test scripts/auto-x11-admin-handoff.test.mjs
      - name: Cross-runner output parity contracts (synthetic only)
        run: node --test scripts/auto-x11-handoff-output-integrity.test.mjs
      - name: Fresh exclusive X11 output directory contracts (isolated temp paths only)
        run: node --test scripts/auto-x11-output-directory.test.mjs
      - name: Controlled Ubuntu 24.04 administrator pilot comparison (synthetic only)
        run: node --test scripts/ubuntu24-controlled-pilot-compare.test.mjs
      - name: Controlled Ubuntu 24.04 A-B-A rollback comparison (synthetic only)
        run: node --test scripts/ubuntu24-controlled-pilot-aba.test.mjs
      - name: Two-desktop Ubuntu 24.04 A-B-A evidence handoff (synthetic only, M29)
        run: node --test scripts/ubuntu24-two-desktop-aba-evidence.test.mjs
      - name: A-B-A six-phase independent evidence receipts (synthetic only, M30)
        run: node --test scripts/ubuntu24-aba-evidence-custody.test.mjs
      - name: Rehash six synthetic artifact buffers in Node and isolated Python (M31)
        run: node --test scripts/ubuntu24-synthetic-byte-provenance.test.mjs
      - name: Validate two-source synthetic artifact custody snapshots (M32)
        run: node --test scripts/ubuntu24-two-source-custody.test.mjs
      - name: AppArmor administrator review classification (synthetic data only)
        run: node --test scripts/ubuntu24-app-profile-review.test.mjs
      - name: Install Weston for a real headless Wayland socket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends weston
      - name: Weston 9 headless CLI compatibility and injection contracts
        run: node --test scripts/weston-9-headless-contract.test.mjs
      - name: Native Wayland packaged GUI smoke in disposable Weston
        timeout-minutes: 5
        run: npm run test:wayland:headless
      - name: Archive Linux portable preview and SHA256
        run: |
          test -x release/OMSI-Manager-Preview-linux-x64/OMSI-Manager-Preview
          tar -czf release/OMSI-Manager-Preview-Linux-x64.tar.gz -C release OMSI-Manager-Preview-linux-x64
          cd release
          sha256sum OMSI-Manager-Preview-Linux-x64.tar.gz > OMSI-Manager-Preview-Linux-x64.sha256
      - name: Upload unsigned Linux portable preview
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: |
            react-prototype/release/OMSI-Manager-Preview-Linux-x64.tar.gz
            react-prototype/release/OMSI-Manager-Preview-Linux-x64.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Public UI screenshots and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-prototype-visual-review
          path: |
            react-prototype/test-results/screenshots/
            react-prototype/test-results/contrast-audit.json
            react-prototype/test-results/gradient-sample.json
            react-prototype/test-results/icon-contrast.json
            react-prototype/test-results/card-layout-audit.json
            react-prototype/test-results/offline-game-covers.png
            react-prototype/test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14


  native_auto_x11:
    name: Native Auto X11 real-window check (${{ matrix.runner }}, strict sandbox)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: react-prototype/release
      - name: Verify and unpack exact CI-built Linux preview
        run: |
          set -euo pipefail
          cd release
          sha256sum -c OMSI-Manager-Preview-Linux-x64.sha256
          python3 -I -S -B ../scripts/controlled_ci_archive_guard.py
          tar --no-same-owner --no-same-permissions -xzf OMSI-Manager-Preview-Linux-x64.tar.gz
          test -x OMSI-Manager-Preview-linux-x64/OMSI-Manager-Auto
      - name: Native ELF sandbox policy preflight (no Electron or policy edits)
        run: |
          node --test scripts/native-sandbox-preflight-contract.test.mjs
          node scripts/native-sandbox-preflight-ci.mjs
      - name: Run real OMSI-Manager-Auto on GNOME/KDE X11 labels in Xvfb
        timeout-minutes: 3
        env:
          CI: 'true'
          OMSI_NATIVE_X11_RUNNER: ${{ matrix.runner }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends x11-utils x11-apps
          # Probe host prerequisites without changing the Electron sandbox.
          node --check scripts/auto-real-x11-smoke.mjs
          node --test scripts/auto-x11-host-policy-contract.test.mjs
          node --test scripts/auto-x11-host-stability.test.mjs
          node --test scripts/auto-x11-native-triage.test.mjs
          node --test scripts/auto-x11-early-native-kernel.test.mjs
          node --test scripts/auto-x11-spawn-witness.test.mjs
          node --test scripts/auto-x11-archive-provenance.test.mjs
          node --test scripts/auto-x11-sanitized-evidence.test.mjs
          node --test scripts/ubuntu24-app-profile-review.test.mjs
          node scripts/auto-x11-host-capabilities.mjs
          # The real auto-launch must still create a mapped X11 window.
          xvfb-run -a node scripts/auto-real-x11-smoke.mjs
      - name: Upload sanitized native X11 evidence, even on strict-sandbox failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-x11-evidence-${{ matrix.runner }}
          path: react-prototype/test-results/native-auto-x11/host-evidence.json
          if-no-files-found: warn
          retention-days: 14
      # Compare two supported hosted Ubuntu images without changing any
      # sandbox, AppArmor, kernel or privilege policy. The same CI-built
      # unsigned Linux artifact and identical X11 proof are required for both.
      # Any failed matrix image MUST keep the workflow red: a successful
      # ubuntu-22.04 run cannot waive a failure on ubuntu-24.04.
      # No --no-sandbox or weakened security is allowed.

  native_x11_evidence_compare:
    name: Compare sanitized X11 host evidence (no sandbox changes)
    needs: [build, native_auto_x11]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cross-runner comparison contracts (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-evidence-diff.test.mjs
      - name: Validate read-only operator handoff contracts (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-admin-handoff.test.mjs
      - name: Validate actual output parity contract (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-handoff-output-integrity.test.mjs
      - name: Validate fresh X11 output directory contracts (isolated temp paths only)
        run: node --test react-prototype/scripts/auto-x11-output-directory.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: native-x11-evidence-ubuntu-22.04
          path: x11-diff-input/ubuntu-22.04
      - uses: actions/download-artifact@v4
        with:
          name: native-x11-evidence-ubuntu-24.04
          path: x11-diff-input/ubuntu-24.04
      - name: Compare only the two fixed, sanitized reports
        env:
          CI: 'true'
        run: node react-prototype/scripts/auto-x11-evidence-diff-ci.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-x11-cross-runner-comparison
          path: x11-diff-output/host-comparison.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload read-only administrator handoff (not an approval)
        uses: actions/upload-artifact@v4
        with:
          name: native-x11-administrator-handoff
          path: |
            x11-diff-output/admin-handoff.json
            x11-diff-output/admin-handoff.md
          if-no-files-found: error
          retention-days: 14
      # This runs even after the Ubuntu 24.04 test fails; it never waives that failure.

  arch_portable_audit:
    name: Arch Linux x64 container / ELF runtime audit (no GUI)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install Electron desktop runtime libraries inside disposable Arch container
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            python binutils gtk3 nss alsa-lib libxss mesa libdrm libxkbcommon
      - uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: arch-portable
      - name: Verify checksum, archive paths and packaged ELF dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd arch-portable
          sha256sum -c OMSI-Manager-Preview-Linux-x64.sha256
          python3 -I -S -B ../react-prototype/scripts/controlled_ci_archive_guard.py
          tar --no-same-owner --no-same-permissions -xzf OMSI-Manager-Preview-Linux-x64.tar.gz
          OMSI_ARCH_AUDIT_SCOPE=CI_UNSIGNED_PACKAGE_ONLY \
            bash ../react-prototype/scripts/arch-portable-dependency-audit.sh \
            OMSI-Manager-Preview-linux-x64
      # Not Hyprland certification: no compositor, GPU, picker or game folders.

  windows_native_lab:
    name: Windows standalone native directory lab (test-only)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Synthetic witness crash and incomplete-history tests
        run: npm run test:witness
      - name: Windows disposable local SID and NTFS DACL proof
        if: runner.environment == 'github-hosted'
        timeout-minutes: 4
        shell: pwsh
        env:
          OMSI_SYNTHETIC_HOSTED_RUNNER: ${{ runner.environment }}
        run: ./native-lab/synthetic-windows-principal-lab.ps1
      - name: Compile standalone C# Win32 handle observer
        shell: pwsh
        run: dotnet publish native-lab/OmsiNativeDirectoryLab.csproj --configuration Release --runtime win-x64 --self-contained false --output native-lab/out
      - name: Test real Win32 executable with disposable fixtures
        shell: pwsh
        run: |
          $env:OMSI_NATIVE_LAB_EXE = (Resolve-Path native-lab/out/OmsiNativeDirectoryLab.exe).Path
          node --test native-lab/native-executable.test.cjs
      # No artifact upload: this experimental binary is not for distribution.

  windows_portable:
    name: Windows portable preview (not signed)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:security
      - name: Portable build identity contract
        run: node --test scripts/portable-build-manifest.test.mjs
      - name: Isolated temporary recovery / process restart fixture
        run: npm run test:recovery:fixture
      - run: npm run package:win
      - name: Test packaged Windows executable (real GUI)
        timeout-minutes: 5
        run: npm run test:portable:windows
      - name: Upload Windows runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-runtime-screenshots
          path: react-prototype/test-results/screenshots/portable-windows/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate portable package and compress
        shell: pwsh
        run: |
          $output = "release/OMSI-Manager-Preview-win32-x64"
          if (!(Test-Path "$output/OMSI-Manager-Preview.exe")) {
            throw "Portable executable not found."
          }
          if (!(Test-Path "$output/resources/app.asar")) {
            throw "Embedded application archive not found."
          }
          Compress-Archive -Path "$output" -DestinationPath "release/OMSI-Manager-Preview-Windows-x64.zip" -Force
          $zip = "release/OMSI-Manager-Preview-Windows-x64.zip"
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OMSI-Manager-Preview-Windows-x64.zip" | Set-Content "release/OMSI-Manager-Preview-Windows-x64.sha256" -Encoding ascii
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-Manager-Preview-Windows-x64-UNSIGNED
          path: |
            react-prototype/release/OMSI-Manager-Preview-Windows-x64.zip
            react-prototype/release/OMSI-Manager-Preview-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 14


  portable_pair_audit:
    name: Windows + Linux archives / same-commit read-only provenance
    needs: [build, windows_portable]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic archive-pair refusal contracts
        run: python3 -m unittest discover -s react-prototype/scripts -p test_portable_pair_audit.py -v
      - uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: pair-artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Windows-x64-UNSIGNED
          path: pair-artifacts/windows
      - name: Verify both SHA256 sidecars and common source commit without extraction
        env:
          OMSI_PAIR_AUDIT_SCOPE: CI_UNSIGNED_PAIRS_ONLY
        run: |
          python3 react-prototype/scripts/portable_pair_audit.py \
            pair-artifacts/linux pair-artifacts/windows
      # Metadata parity is not a digital signature or a real KDE/GNOME test.

  synthetic_two_revision_contract:
    name: Synthetic fixture two-revision comparison (CI only)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # These are code-only checkouts into disposable GitHub-hosted workspace.
      # Neither revision receives mod files, a game folder or credentials.
      - name: Checkout candidate revision, without persisted credentials
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout fixed M18 baseline commit, without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: c260b0b5e6325c44766788a528e8a2aee8237333
          path: baseline
          persist-credentials: false
      - name: Compare both analyzers using identical in-memory synthetic ZIPs
        env:
          CI: 'true'
        run: python3 -I -S -B candidate/react-prototype/scripts/controlled_ci_revision_diff.py
      # A changed contract group makes THIS job fail for review. It cannot
      # waive the separate strict Ubuntu 24.04 sandbox job or approve release.

  github_independent_review_observation:
    name: GitHub independent PR review observation (read-only; no approval)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code with no persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic GitHub review metadata adversarial contracts
        run: python3 -m unittest discover -s react-prototype/scripts -p test_controlled_github_review_audit.py -v
      - name: Observe actual pull request reviews (never approve or merge)
        env:
          GH_REVIEW_EVENT: ${{ github.event_name }}
          GH_REVIEW_REPOSITORY: ${{ github.repository }}
          GH_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REVIEW_TOKEN: ${{ github.token }}
        run: python3 -I -S -B react-prototype/scripts/controlled_github_review_audit.py
      # Successful observation DOES NOT mean approval, release, or a green
      # Ubuntu 24.04 strict-sandbox gate. No bypass, no writes, no merge.

  github_base_policy_codeowners_observation:
    name: GitHub base branch rules and CODEOWNERS observation (no approval)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic branch-policy and CODEOWNERS contract tests
        run: python3 -m unittest discover -s react-prototype/scripts -p test_controlled_base_policy_audit.py -v
      - name: Observe base rules and CODEOWNERS pinned to event base SHA
        env:
          GH_POLICY_EVENT: ${{ github.event_name }}
          GH_POLICY_REPOSITORY: ${{ github.repository }}
          GH_POLICY_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_POLICY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_POLICY_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_POLICY_TOKEN: ${{ github.token }}
        run: python3 -I -S -B react-prototype/scripts/controlled_base_policy_audit.py
      # Read-only evidence cannot waive GitHub review rules, failed M20
      # regression contracts, CODEOWNERS checks or Ubuntu 24.04 X11 sandbox.

  github_default_branch_rollout_plan:
    name: GitHub default branch protection rollout proposal (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout current candidate code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run advisory default-branch policy rollout contracts
        run: python3 -m unittest discover -s react-prototype/scripts -p test_controlled_default_branch_rollout.py -v
      - name: Inspect default branch only (no rule or CODEOWNERS writes)
        env:
          GH_DEFAULT_PLAN_EVENT: ${{ github.event_name }}
          GH_DEFAULT_PLAN_REPOSITORY: ${{ github.repository }}
          GH_DEFAULT_PLAN_TOKEN: ${{ github.token }}
        run: python3 -I -S -B react-prototype/scripts/controlled_default_branch_rollout.py
      # This job reports planning evidence only: reviewer unknown, zero
      # checks selected, no branch protection writes, no merge/release.

  github_ci_context_readiness_audit:
    name: GitHub CI context readiness audit (no branch rule writes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate workflow without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test read-only Actions names, filters, and blocker contracts
        run: python3 -m unittest discover -s react-prototype/scripts -p test_controlled_ci_context_readiness.py -v
      - name: Observe exact job labels against a completed PR reference run
        env:
          GH_CONTEXT_EVENT: ${{ github.event_name }}
          GH_CONTEXT_REPOSITORY: ${{ github.repository }}
          GH_CONTEXT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_CONTEXT_RUN_ID: ${{ github.run_id }}
          GH_CONTEXT_TOKEN: ${{ github.token }}
        run: python3 -I -S -B react-prototype/scripts/controlled_ci_context_readiness.py
      # This job never selects required check contexts. A successful run
      # means inspection only, NOT a green Ubuntu 24.04 or merge approval.

  github_docs_only_check_run_observation:
    name: GitHub docs-only CI check-run evidence (read-only, not approval)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    steps:
