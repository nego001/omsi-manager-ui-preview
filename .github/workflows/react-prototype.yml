  m40_cross_runner_compare:
    name: M40 read-only Ubuntu22 vs Ubuntu24 direct exit comparison
    needs: [build, m40_direct_ubuntu22, m40_direct_ubuntu24]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - name: Checkout same candidate without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node for fail-closed pair comparator
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck M40 pair schema (synthetic contracts only)
        run: node --test scripts/auto-x11-cross-runner-exit.test.mjs
      - name: Download both sanitized runner exit reports
        uses: actions/download-artifact@v4
        with:
          pattern: m40-direct-*-sanitized
          path: react-prototype/test-results/m40
          merge-multiple: true
      - name: Compare exact 22.04 and 24.04 statuses without gate waiver
        env:
          CI: 'true'
        run: node scripts/auto-x11-cross-runner-exit-compare.mjs
      - name: Download both M40 parent exit reports for M41 consistency check
        uses: actions/download-artifact@v4
        with:
          pattern: m40-direct-*-sanitized
          path: react-prototype/test-results/m41
          merge-multiple: true
