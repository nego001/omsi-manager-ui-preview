      - name: Verify M32 two-source artificial custody and drift contracts
        run: node --test react-prototype/scripts/ubuntu24-two-source-custody.test.mjs
      # Red tests must remain red: no continue-on-error and no real artifact.

  ubuntu24_syscall_triage:
    name: Ubuntu 24.04 Electron syscall triage (read-only)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up known Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact same unsigned Linux package from build job
        uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: react-prototype/release
      - name: Verify SHA256 and guarded synthetic-only preview extraction
        run: |
          set -euo pipefail
          cd release
          sha256sum -c OMSI-Manager-Preview-Linux-x64.sha256
          python3 -I -S -B ../scripts/controlled_ci_archive_guard.py
          tar --no-same-owner --no-same-permissions -xzf OMSI-Manager-Preview-Linux-x64.tar.gz
          test -x OMSI-Manager-Preview-linux-x64/OMSI-Manager-Preview
      - name: Run M33 sanitized syscall parser adversarial contracts
        run: node --test scripts/auto-x11-sigtrap-syscalls.test.mjs
      - name: Validate M34 syscall-operation subtypes and denial boundaries
        run: node --test scripts/auto-x11-prctl-context.test.mjs
      - name: Recheck M34 import graph before tracing real packaged Electron
        run: node --test scripts/auto-x11-import-cycle.test.mjs
      - name: Test M35 kernel capability boundary categories (synthetic only)
        run: node --test scripts/auto-x11-capbset-boundary.test.mjs
      - name: Validate M36 symbolic name contracts before real strace
        run: node --test scripts/auto-x11-symbolic-capabilities.test.mjs
      - name: Check M37 raw numeric CAP unknown annotation refusal contracts
        run: node --test scripts/auto-x11-annotated-capability-indices.test.mjs
      - name: Verify M38 direct native signal comparison before executing Electron
        run: node --test scripts/auto-x11-untraced-exit-control.test.mjs
      - name: Check M39 four-run non-ptrace signal contracts before real trace
        run: node --test scripts/auto-x11-untraced-repeatability.test.mjs
      - name: Collect read-only untraced host userns category for comparison
        env:
          CI: 'true'
        run: node scripts/auto-x11-host-capabilities.mjs
      - name: Install diagnostic tracer and Xvfb on disposable runner only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace xvfb
      - name: Trace unmodified packaged Electron with sandbox intact
        timeout-minutes: 2
        env:
          CI: 'true'
          M33_RUNNER: ubuntu-24.04
        run: xvfb-run -a node scripts/auto-x11-sigtrap-syscalls.mjs
      # This diagnostic is independent from the MANDATORY strict native
      # X11 24.04 gate. It NEVER overrides a failure in native_auto_x11.
      # The strace observer can affect process behavior: no causal verdict.
      # Traces are temporary, erased and NEVER uploaded or logged raw.

  m33_syscall_parser_synthetic:
    name: M33 sanitized syscall triage parser (synthetic tests only)
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout synthetic parser without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate EPERM/SIGTRAP parser against adversarial fake traces
        run: node --test react-prototype/scripts/auto-x11-sigtrap-syscalls.test.mjs
      - name: Validate M34 explicit namespace denial vs PRCTL EINVAL classification
        run: node --test react-prototype/scripts/auto-x11-prctl-context.test.mjs
      - name: Guard M34 static import against unresolved top-level await
        run: node --test react-prototype/scripts/auto-x11-import-cycle.test.mjs
      - name: Test M35 PR_CAPBSET_READ kernel bound classifier (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-capbset-boundary.test.mjs
      - name: Verify M36 Linux UAPI capability name decoding (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-symbolic-capabilities.test.mjs
      - name: Test M37 strict numeric CAP unknown annotation decoder
        run: node --test react-prototype/scripts/auto-x11-annotated-capability-indices.test.mjs
      - name: Verify M38 non-ptrace SIGTRAP exit and process refusal contracts
        run: node --test react-prototype/scripts/auto-x11-untraced-exit-control.test.mjs
      - name: Verify M39 four-run SIGTRAP repeatability contracts (synthetic only)
        run: node --test react-prototype/scripts/auto-x11-untraced-repeatability.test.mjs
      - name: Verify M40 direct Linux cross-runner exit comparison contracts
        run: node --test react-prototype/scripts/auto-x11-cross-runner-exit.test.mjs
      - name: Verify M41 owned X11 process window witness contracts
        run: node --test react-prototype/scripts/auto-x11-cross-runner-owned-window.test.mjs
      - name: Verify M42 read-only userns categories and M41 pairing contracts
        run: node --test react-prototype/scripts/auto-x11-direct-userns-compare.test.mjs
      # No strace, package, host policy or real Electron in this job.

  m40_direct_ubuntu22:
    name: M40 direct Electron exit observation (ubuntu-22.04, no ptrace)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - name: Checkout immutable PR commit without stored GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node runtime for read-only categorized observation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download same unsigned archive generated by build
        uses: actions/download-artifact@v4
        with:
          name: OMSI-Manager-Preview-Linux-x64-UNSIGNED
          path: react-prototype/release
      - name: Verify checksum and archive headers before bounded extraction
        run: |
          set -euo pipefail
          cd release
          sha256sum -c OMSI-Manager-Preview-Linux-x64.sha256
          python3 -I -S -B ../scripts/controlled_ci_archive_guard.py
          tar --no-same-owner --no-same-permissions -xzf OMSI-Manager-Preview-Linux-x64.tar.gz
          test -x OMSI-Manager-Preview-linux-x64/OMSI-Manager-Preview
      - name: Validate M40 fail-closed parser and CLI guards on this runner
        run: node --test scripts/auto-x11-cross-runner-exit.test.mjs
      - name: Validate M41 native ownership, mapping and report integrity contracts
        run: node --test scripts/auto-x11-cross-runner-owned-window.test.mjs
      - name: Validate M42 direct userns host categories without privilege writes
        run: node --test scripts/auto-x11-direct-userns-compare.test.mjs
      - name: Sample read-only namespaces before disposable X11 installation
        env:
          CI: 'true'
          M40_RUNNER: ubuntu-22.04
        run: node scripts/auto-x11-direct-userns-observation.mjs
      - name: Install only Xvfb and X11 query tools on disposable runner
        run: |
          set -euo pipefail
          # Some hosted apt mirrors briefly publish an incomplete package
          # index. Retry the SAME official package operation up to 3 times;
          # do not edit apt sources, change kernel policy or bypass checks.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get update -qq -o Acquire::Retries=3 &&
               sudo apt-get install -y --no-install-recommends                  -o Acquire::Retries=3 xvfb x11-utils; then
              installed=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 4; fi
          done
          if [ "$installed" -ne 1 ]; then
            echo 'M41_X11_PREREQUISITE_UNAVAILABLE' >&2
            exit 1
          fi
          command -v xvfb-run >/dev/null
          command -v xwininfo >/dev/null
          command -v xprop >/dev/null
      - name: Execute exact packaged Electron directly with sandbox intact
        timeout-minutes: 2
        env:
          CI: 'true'
          M40_RUNNER: ubuntu-22.04
        run: xvfb-run -a node scripts/auto-x11-cross-runner-direct-exit.mjs
      - name: Upload only fixed sanitized exit JSON; no raw stderr or files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m40-direct-ubuntu-22.04-sanitized
          path: react-prototype/test-results/m40-direct-ubuntu-22.04.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload only process-owned X11 witness categories from same child
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m41-window-ubuntu-22.04-sanitized
          path: react-prototype/test-results/m41-window-ubuntu-22.04.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized M42 userns host categories only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m42-userns-ubuntu-22.04-sanitized
          path: react-prototype/test-results/m42-userns-ubuntu-22.04.json
          if-no-files-found: error
          retention-days: 7
      # This is a separate diagnostic, not a replacement for native_auto_x11.

