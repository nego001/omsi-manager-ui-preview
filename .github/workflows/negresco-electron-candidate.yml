name: Negresco Electron security upgrade candidate
on:
  pull_request:
    paths:
      - '.github/workflows/negresco-electron-candidate.yml'
      - 'react-prototype/scripts/electron-upgrade-candidate.mjs'
      - 'react-prototype/package.json'
      - 'react-prototype/package-lock.json'
permissions:
  contents: read
concurrency:
  group: negresco-electron-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact upgrade manifest in isolated workspace
        run: node scripts/electron-upgrade-candidate.mjs prepare
      - name: Resolve candidate without lifecycle scripts
        working-directory: react-prototype/electron-candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Validate candidate dependency graph
        run: node scripts/electron-upgrade-candidate.mjs seal
      - name: Audit candidate dependencies
        working-directory: react-prototype/electron-candidate
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --ignore-scripts --json --registry=https://registry.npmjs.org/ > npm-audit.json
          status=$?
          set -e
          printf '%s\n' "$status" > npm-audit-exit.txt
      - name: Publish proposal and advisory evidence
        uses: actions/upload-artifact@v4
        with:
          name: negresco-electron-45-candidate
          path: react-prototype/electron-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Reject high or critical advisories or invalid audit
        run: node scripts/electron-upgrade-candidate.mjs audit
  verify:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: negresco-electron-45-candidate
          path: react-prototype/electron-candidate
      - name: Verify manifest, lock and advisory report
        run: node scripts/electron-upgrade-candidate.mjs verify
      - name: Clean install, without binary downloads or lifecycle scripts
        working-directory: react-prototype/electron-candidate
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Verify unchanged lock and exact installed Electron version
        run: node scripts/electron-upgrade-candidate.mjs installed
  runtime:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: negresco-electron-45-candidate
          path: react-prototype/electron-candidate
      - name: Verify exact candidate provenance before runtime experiment
        run: node scripts/electron-upgrade-candidate.mjs verify
      - name: Copy only required source and test inputs into isolated candidate
        run: node -e 'const fs=require("node:fs");for(const n of ["src","electron","scripts","examples","native-lab","native-launcher","index.html","tsconfig.json","vite.config.ts","playwright.config.ts"])fs.cpSync(n,"electron-candidate/"+n,{recursive:true,errorOnExist:true,force:false})'
      - name: Install locked dependencies including Electron binary
        working-directory: react-prototype/electron-candidate
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Check exact resolved runtime package and unchanged lock
        run: node scripts/electron-upgrade-candidate.mjs installed
      - name: TypeScript and renderer CSP build
        working-directory: react-prototype/electron-candidate
        run: npm run build
      - name: Security and IPC contract tests
        working-directory: react-prototype/electron-candidate
        run: npm run test:security
      - name: Linux GUI dependencies
        if: matrix.os == 'ubuntu-22.04'
        working-directory: react-prototype/electron-candidate
        run: npx playwright install --with-deps chromium
      - name: Linux strict sandbox desktop smoke
        if: matrix.os == 'ubuntu-22.04'
        working-directory: react-prototype/electron-candidate
        run: xvfb-run -a npm run test:desktop
      - name: Linux synthetic IPC inspection
        if: matrix.os == 'ubuntu-22.04'
        working-directory: react-prototype/electron-candidate
        run: xvfb-run -a npm run test:inspection:e2e
      - name: Windows strict sandbox desktop smoke
        if: matrix.os == 'windows-latest'
        working-directory: react-prototype/electron-candidate
        run: npm run test:desktop
      - name: Windows synthetic IPC inspection
        if: matrix.os == 'windows-latest'
        working-directory: react-prototype/electron-candidate
        run: npm run test:inspection:e2e
      - name: Confirm candidate lock still unchanged
        run: node scripts/electron-upgrade-candidate.mjs installed
  handoff:
    needs: [verify, runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: react-prototype
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: negresco-electron-45-candidate
          path: react-prototype/electron-candidate
      - name: Verify and emit public candidate manifest and lock for exact maintainer import
        run: node scripts/electron-upgrade-candidate.mjs handoff
